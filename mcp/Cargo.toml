[package]
name = "bookmark-bridge"
version = "2.0.2"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = "0.13"
getrandom = "0.3"

[profile.release]
strip = true
opt-level = "z"
lto = true

[dev-dependencies]
tempdir = "0.3"
