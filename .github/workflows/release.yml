# Ships prebuilt binaries so nobody has to install Rust to use this.
# Building from source was the single biggest reason not to bother.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check release version and channel
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          npm_version=$(node -p 'require("./npm/package.json").version')
          rust_version=$(cargo metadata --manifest-path mcp/Cargo.toml --locked --no-deps --format-version 1 | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).packages[0].version')
          test "$RELEASE_TAG" = "v$npm_version"
          test "$rust_version" = "$npm_version"
          if [[ "$RELEASE_TAG" == v2.* ]]; then
            test "$(node -p 'require("./npm/package.json").publishConfig.tag')" = native
          fi
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: mcp
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        working-directory: mcp
        # bash on the Windows runner too, so one script covers every target.
        shell: bash
        run: |
          set -euo pipefail
          name="bookmark-bridge-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/bookmark-bridge${{ matrix.exe }}" "dist/$name/"
          cp ../LICENSE ../README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: mcp/dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        # Computed here rather than per-runner, so one tool produces them all and
        # the npm launcher has a single format to parse.
        run: cd artifacts && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == v2.* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" --generate-notes --verify-tag "${release_flags[@]}" \
            artifacts/*.tar.gz artifacts/SHA256SUMS
