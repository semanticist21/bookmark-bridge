# Ships prebuilt binaries so nobody has to install Rust to use this.
# Building from source was the single biggest reason not to bother.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: mcp
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        working-directory: mcp
        # bash on the Windows runner too, so one script covers every target.
        shell: bash
        run: |
          set -euo pipefail
          name="bookmark-bridge-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/bookmark-bridge${{ matrix.exe }}" "dist/$name/"
          cp ../LICENSE ../README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: mcp/dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        # Computed here rather than per-runner, so one tool produces them all and
        # the npm launcher has a single format to parse.
        run: cd artifacts && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --generate-notes --verify-tag \
            artifacts/*.tar.gz artifacts/SHA256SUMS
