<!doctype html>
<meta charset="utf-8">
<title>Bridgey</title>
<link rel="stylesheet" href="popup.css">
<main>
  <h1>Bridgey <span class="tag">Bookmark MCP</span></h1>

  <ul class="lights">
    <li><span class="dot" id="dotWorker"></span><span class="k">Service worker</span><span class="v" id="vWorker">—</span></li>
    <li><span class="dot" id="dotSocket"></span><span class="k">Bridge</span><span class="v" id="vSocket" role="status">—</span></li>
  </ul>

  <dl class="fields">
    <dt><label for="mode">Mode</label></dt>
    <dd><select id="mode" disabled>
      <option value="legacy">Legacy (WebSocket)</option>
      <option value="native">Native Messaging</option>
    </select></dd>
    <dt id="portLabel"><label for="port">Port</label></dt>
    <dd id="portField"><input id="port" type="number" min="1" max="65535" inputmode="numeric"></dd>
    <dt><label for="enabled">Enabled</label></dt>
    <dd><input id="enabled" type="checkbox" class="switch" role="switch"></dd>
  </dl>

  <p class="hint" id="hint" hidden>
    <span id="hintText" role="status"></span>
    <code id="setupCommand" hidden></code>
    <a id="help" href="https://github.com/semanticist21/bookmark-bridge#install"
       target="_blank" rel="noreferrer">Setup guide</a>
  </p>

  <div class="row">
    <!-- Reconnect redials the socket. Reload restarts the whole extension,
         which is only needed when its code changed or the worker is wedged. -->
    <button id="reconnect">Reconnect</button>
    <button id="reload" title="Restart the extension">Reload</button>
  </div>
</main>
<script src="popup.js"></script>
